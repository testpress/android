name: PR Review with Progress Tracking

# Docs:    https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
# Example: https://github.com/anthropics/claude-code-action/blob/main/examples/pr-review-comprehensive.yml

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  review-with-tracking:
    if: |
      github.actor != 'claude[bot]' &&
      github.actor != 'github-actions[bot]' &&
      (
        (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@claude review'))
      )
    runs-on: ubuntu-latest
    concurrency:
      group: pr-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: PR Review with Progress Tracking
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            This is a mixed Java/Kotlin Android application project. Perform a comprehensive code review for this PR. You are acting as a Senior Android Engineer with 15+ years of experience reviewing high-performance Android applications (Kotlin, Java, ViewModels, LiveData, Coroutines, Jetpack Compose, Dagger, TestpressCallback, GreenDAO, Room).

            Read `CODING_STANDARDS.md` before reviewing the pull request. Treat it as
            the single source of truth for architectural guidelines, code quality, memory safety,
            threading, testing, review guardrails, and comment templates.

            Perform a comprehensive code review with the following focus areas:
            1. **Coding Standards**: Apply every relevant section and rule in `CODING_STANDARDS.md` to each changed file.
            2. **Security**: Audit for potential security vulnerabilities, token/credential leaks, input sanitization, and authentication/authorization logic flaws.
            3. **Performance**: Identify performance bottlenecks, inefficient queries (GreenDAO/Room), memory leaks, resource issues, and excessive allocations.
            4. **Testing**: Verify adequate test coverage, review test quality and edge cases, check for missing test scenarios, and ensure proper handling of lifecycle events.
            5. **Documentation**: Ensure code is properly documented, verify README updates for new features, and check API documentation accuracy.

            Review Instructions:
            - Put each finding on the smallest relevant changed line.
            - Focus only on modified lines. Do not comment on unmodified code unless directly impacted.
            - Cite the exact `CODING_STANDARDS.md` section and rule for every standards finding. Skip findings with no specific, verifiable violation.
            - Format every inline comment and top-level summary strictly according to the templates in Section 8 of `CODING_STANDARDS.md`.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
